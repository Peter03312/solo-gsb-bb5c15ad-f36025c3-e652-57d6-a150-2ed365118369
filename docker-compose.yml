services:
  workbench:
    build: .
    image: potsherd-workbench:latest
    container_name: potsherd-workbench
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # 容器内监听端口（一般不用改；改宿主端口用 HOST_PORT）
      PORT: "8080"
      # SQLite 数据库与上传照片的存放目录
      DATA_DIR: /data
      # 单张照片上传上限（MB）
      MAX_UPLOAD_MB: "20"
    volumes:
      - workbench-data:/data
    restart: unless-stopped

volumes:
  workbench-data:
